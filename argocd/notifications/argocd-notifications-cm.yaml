apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token

  service.webhook.discord: |
    url: $discord-webhook-url
    headers:
      - name: Content-Type
        value: application/json

  template.app-deployed: |
    message: |
      Application {{.app.metadata.name}} successfully synced to revision {{.app.status.sync.revision | call .repo.GetCommitMetadata .app.status.sync.revision | call .strings.Trunc 7}}.
    slack:
      attachments: |
        [{
          "color": "#10B981",
          "title": "{{.app.metadata.name}} deployed to production",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "fields": [
            { "title": "Sync Status", "value": "{{.app.status.sync.status}} (Health: {{.app.status.health.status}})", "short": true },
            { "title": "Author", "value": "{{ (call .repo.GetCommitMetadata .app.status.sync.revision).Author }}", "short": true },
            { "title": "Active Container Images", "value": "{{ range .app.status.summary.images }}- `{{ . }}`\n{{ end }}", "short": false },
            { "title": "Commit Message", "value": "{{ (call .repo.GetCommitMetadata .app.status.sync.revision).Message }}", "short": false }
          ],
          "footer": "ViralVision GitOps Pipeline",
          "ts": {{.app.status.operationState.finishedAt.Unix}}
        }]
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [{
              "title": "{{.app.metadata.name}} deployed to production",
              "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": 1096065,
              "fields": [
                { "name": "Sync Status", "value": "{{.app.status.sync.status}} ({{.app.status.health.status}})", "inline": true },
                { "name": "Author", "value": "{{ (call .repo.GetCommitMetadata .app.status.sync.revision).Author }}", "inline": true },
                { "name": "Active Images", "value": "{{ range .app.status.summary.images }}- `{{ . }}`\n{{ end }}" }
              ],
              "footer": { "text": "ViralVision GitOps Pipeline" }
            }]
          }

  template.app-sync-failed: |
    message: |
      Sync failed for application {{.app.metadata.name}}.
    slack:
      attachments: |
        [{
          "color": "#EF4444",
          "title": "{{.app.metadata.name}} sync failed",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "fields": [
            { "title": "Target Revision", "value": "{{.app.status.sync.revision}}", "short": true },
            { "title": "Health Status", "value": "{{.app.status.health.status}}", "short": true },
            { "title": "Error Summary", "value": "```{{.app.status.operationState.message}}```", "short": false }
          ],
          "footer": "ViralVision GitOps Pipeline"
        }]
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [{
              "title": "{{.app.metadata.name}} sync failed",
              "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": 15680580,
              "description": "```{{.app.status.operationState.message}}```",
              "fields": [
                { "name": "Health Status", "value": "{{.app.status.health.status}}", "inline": true }
              ]
            }]
          }

  template.app-health-degraded: |
    message: |
      Health degraded on {{.app.metadata.name}} -- pod crashes or OOM events detected.
    slack:
      attachments: |
        [{
          "color": "#F59E0B",
          "title": "{{.app.metadata.name}} cluster health degraded",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "text": "One or more resources in `production` entered a degraded state.",
          "footer": "ViralVision Cluster Sentinel"
        }]
    webhook:
      discord:
        method: POST
        body: |
          {
            "embeds": [{
              "title": "{{.app.metadata.name}} cluster health degraded",
              "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": 16096779,
              "description": "Resources in the cluster entered a degraded state. Inspect worker/API pods."
            }]
          }

  trigger.on-deployed: |
    - description: Application sync succeeded and healthy
      send: [app-deployed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'

  trigger.on-sync-failed: |
    - description: Application sync execution failed
      send: [app-sync-failed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Failed', 'Error']

  trigger.on-health-degraded: |
    - description: Cluster health status entered degraded state
      send: [app-health-degraded]
      when: app.status.health.status == 'Degraded'
