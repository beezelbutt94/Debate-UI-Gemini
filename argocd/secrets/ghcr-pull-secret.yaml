# Template only -- replace both placeholders with a real GHCR read token
# before applying. Never commit the filled-in version to version control;
# apply it directly with `kubectl apply` or a secrets manager instead.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth-token
  namespace: argocd
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "REPLACE_WITH_GHCR_USERNAME",
          "password": "REPLACE_WITH_GITHUB_PAT_PACKAGE_READ"
        }
      }
    }
