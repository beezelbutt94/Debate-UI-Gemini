name: Next.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: this workflow only checks out and builds. Without an
# explicit block the job inherits the repository default, which can be
# read/write on every scope -- so a compromised dependency in `npm ci`
# would run with a token that can push.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Not 20.x: @supabase/supabase-js declares `engines.node >= 22`, so a
        # Node 20 job tests a dependency configuration the tree says is invalid.
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Build
      # ClerkProvider reads NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY during static
      # prerendering (see .env.example), so `next build` hard-fails without
      # one -- even in CI, which never had a real Clerk app to point at.
      # Publishable keys are meant to be public (embedded in the client
      # bundle), so a syntactically-valid placeholder is safe to check in
      # here; it only needs to satisfy Clerk's own format validation, not
      # authenticate anything. Decodes to "dummy.clerk.accounts.dev$".
      env:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
      run: npm run build
