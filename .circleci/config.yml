# CircleCI configuration for Next.js (viralengine)
# CircleCI configuration for the ViralEngine Next.js application.
# See: https://circleci.com/docs/reference/configuration-reference/
version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Lint
          command: npm run lint

      - run:
          name: Type check
          command: npm run typecheck

      - run:
          name: Build
          # Dummy build-time env vars so Next.js/Clerk don't abort the build.
          # These are never used at runtime in CI — they only satisfy static
          # key-presence checks during `next build`.
          environment:
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_aHR0cHM6Ly9wbGFjZWhvbGRlci5jbGVyay5hY2NvdW50cy5kZXYk
            NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
            NEXT_PUBLIC_APP_URL: http://localhost:3000
            NEXT_PUBLIC_ROOT_DOMAIN: localhost
          command: npm run build

workflows:
  sample:
    jobs:
      - build-and-test
