# CircleCI configuration for Next.js (viralengine)
version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Lint
          command: npm run lint

      - run:
          name: Type check
          command: npm run typecheck

      - run:
          name: Build
          command: npm run build
          environment:
            # Placeholder values so Next.js can compile without real secrets.
            # Real values are injected from CircleCI project env vars in deployments.
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
            CLERK_SECRET_KEY: sk_test_placeholder

workflows:
  sample:
    jobs:
      - build-and-test
