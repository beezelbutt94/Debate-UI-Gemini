# CircleCI configuration for Next.js (viral-trending)
# CircleCI configuration for the Viral Trending Next.js application.
# See: https://circleci.com/docs/reference/configuration-reference/
version: 2.1

jobs:
  install:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      # Share node_modules with downstream jobs so they skip a second npm ci.
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  lint-and-typecheck:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - attach_workspace:
          at: .

      - run:
          name: Lint
          command: npm run lint

      - run:
          name: Type check
          command: npm run typecheck

  build:
    docker:
      - image: cimg/node:22.19
    # large = 4 vCPU / 8 GB RAM; Next.js builds are CPU-bound and benefit
    # from the extra cores for parallel compilation and minification.
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .

      # Next.js writes incremental build artefacts to .next/cache.
      # Restoring this between runs can cut build time significantly.
      # Keys cascade from most-specific to broadest so partial cache hits work.
      - restore_cache:
          keys:
            - next-cache-v1-{{ .Branch }}-{{ .Revision }}
            - next-cache-v1-{{ .Branch }}-
            - next-cache-v1-

      - run:
          name: Build
          no_output_timeout: 10m
          # Dummy build-time env vars so Next.js/Clerk don't abort the build.
          # These are never used at runtime in CI -- they only satisfy static
          # checks during `next build`.
          #
          # The Clerk key is NOT an arbitrary placeholder: @clerk/clerk-react
          # validates its shape and rejects anything malformed with
          # "The publishableKey passed to Clerk is invalid", which fails
          # prerendering and exits 1. It must be pk_test_ followed by
          # base64 of "<host>$". This one decodes to "dummy.clerk.accounts.dev$"
          # and is the same value .github/workflows/ci.yml uses -- keep them
          # identical so a fix to one is not missed on the other.
          environment:
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
            NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
            NEXT_PUBLIC_APP_URL: http://localhost:3000
            NEXT_PUBLIC_ROOT_DOMAIN: localhost
          command: npm run build

      - save_cache:
          key: next-cache-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - .next/cache

workflows:
  ci:
    jobs:
      - install
      - lint-and-typecheck:
          requires:
            - install
      - build:
          requires:
            - install
