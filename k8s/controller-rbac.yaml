# Least-privilege ServiceAccount for whatever pod runs app/k8s_controller.py
# (the domain-provisioning API process, or a dedicated controller pod).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: domain-controller-sa
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: domain-controller-role
  namespace: production
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: domain-controller-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: domain-controller-sa
    namespace: production
roleRef:
  kind: Role
  name: domain-controller-role
  apiGroup: rbac.authorization.k8s.io
