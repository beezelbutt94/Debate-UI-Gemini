# Runs `alembic upgrade head` as an ArgoCD PreSync hook so the deployment
# rollout waits for schema changes to land first.
apiVersion: batch/v1
kind: Job
metadata:
  name: viral-trending-db-migration
  namespace: production
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: viral-trending-db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: alembic-migrator
          image: ghcr.io/viral-trending/api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: viral-trending-production-secrets
            - configMapRef:
                name: viral-trending-production-config
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "250m"
              memory: 512Mi
