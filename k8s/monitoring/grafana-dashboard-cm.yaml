# Grafana dashboard (auto-discovered via the `grafana_dashboard: "1"`
# label, per the kube-prometheus-stack sidecar convention) covering GPU
# VRAM, active transcodes, render latency, and queue backlog.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gpu-transcode
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gpu-transcode-overview.json: |
    {
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "GPU Hardware Telemetry & VRAM Allocation",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 80 },
                  { "color": "red", "value": 92 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "id": 2,
          "targets": [
            { "expr": "viral_trending_gpu_vram_usage_percentage", "legendFormat": "{{device_id}} VRAM", "refId": "A" }
          ],
          "title": "GPU Memory (VRAM) Utilization",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 16, "x": 8, "y": 1 },
          "id": 3,
          "targets": [
            { "expr": "sum(viral_trending_active_transcodes) by (tier)", "legendFormat": "Active ({{tier}})", "refId": "A" },
            { "expr": "sum(rate(viral_trending_render_failures_total[2m])) by (reason)", "legendFormat": "Failures: {{reason}}", "refId": "B" }
          ],
          "title": "Active Encoding Streams vs. Failures",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 4,
          "title": "Queue Pressures & Pipeline Latencies",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "id": 5,
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(viral_trending_transcode_duration_seconds_bucket[5m])) by (le, tier))", "legendFormat": "p95 Duration ({{tier}})", "refId": "A" },
            { "expr": "histogram_quantile(0.50, sum(rate(viral_trending_transcode_duration_seconds_bucket[5m])) by (le, tier))", "legendFormat": "p50 Duration ({{tier}})", "refId": "B" }
          ],
          "title": "Transcode Execution Latency (p50 / p95)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "id": 6,
          "targets": [
            { "expr": "redis_queue_length{queue='premium_sla'}", "legendFormat": "Queue: Premium SLA", "refId": "A" },
            { "expr": "redis_queue_length{queue='standard_jobs'}", "legendFormat": "Queue: Standard Jobs", "refId": "B" },
            { "expr": "redis_queue_length{queue='draft_preview'}", "legendFormat": "Queue: Draft Previews", "refId": "C" }
          ],
          "title": "Redis Queue Backlog Depth (KEDA Scaling Trigger)",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["viral-trending", "gpu", "nvenc", "production"],
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "Viral Trending GPU Rendering Pipeline",
      "uid": "viral-trending-gpu-pipeline"
    }
